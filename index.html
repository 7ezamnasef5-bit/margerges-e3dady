<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة كنيسة مارجرجس</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

    <div class="wrapper">
        
        <section id="loginSection" class="glass-card login-card animate-pop">
            <div class="brand-icon"><img src="icon-margerges.png" alt="شعار الكنيسة"></div>
            <h2>اجتماع إعدادي مارجرجس</h2>
            <br>
            <p class="subtitle">كنيسة الشهيد العظيم مارجرجس بالإسماعيلية</p>
            <div class="next-meeting" id="nextMeeting"></div>
            
            <div class="input-field">
                <label for="loginInput">اسم المخدوم أو كود الخادم</label>
                <input type="text" id="loginInput" placeholder="أدخل بيانات الدخول..." autocomplete="off">
            </div>
            
            <button onclick="handleLogin()" class="btn-glow">دخول النظام </button>
        </section>

        <section id="adminSection" class="dashboard-layout animate-pop" style="display: none;">
            
            <header class="dash-header glass-card">
                <div class="header-info">
                    <h2>لوحة متابعة المخدومين 🛠️</h2>
                    <span class="badge-servant">حساب خادم</span>
                </div>
                <button onclick="logout()" class="btn-logout">تسجيل خروج 🚪</button>
            </header>

            <div class="dash-grid">
                
                <div class="glass-card form-panel">
                    <h3 id="formTitle">➕ إضافة مخدوم جديد</h3>
                    <form id="makhdoumForm" onsubmit="saveMakhdoum(event)">
                        <div class="input-field">
                            <input type="text" id="name" placeholder="الاسم الثلاثي" required>
                        </div>
                        <div class="input-field">
                            <input type="tel" id="phone" placeholder="رقم التليفون" required>
                        </div>
                        <div class="input-field">
                            <input type="text" id="address" placeholder="العنوان بالتفصيل" required>
                        </div>
                        <div class="input-field">
                            <label for="birthdate" id="lblBirthdate">تاريخ الميلاد</label>
                            <input type="date" id="birthdate" required>
                        </div>
                        <div class="input-row">
                            <div class="input-field">
                                <input type="number" id="age" placeholder="السن" required>
                            </div>
                            <div class="input-field">
                                <input type="number" id="grade" placeholder="الدرجة" required>
                            </div>
                        </div>
                        <button type="submit" id="submitBtn" class="btn-action success">حفظ المخدوم 💾</button>
                    </form>
                </div>

                <div class="glass-card table-panel">
                    <div class="table-header-flex">
                        <h3>📊 قائمة المخدومين والدرجات</h3>
                        <div class="input-field search-field">
                            <input type="text" id="searchInput" onkeyup="filterTable()" placeholder=" بحث باسم المخدوم أو رقم التليفون...">
                        </div>
                        <div class="export-buttons">
                            <button type="button" onclick="exportToExcel()" class="tbl-btn export-excel" title="تحميل ملف اكسيل">📥 Excel</button>
                            <button type="button" onclick="exportToPDF()" class="tbl-btn export-pdf" title="طباعة / حفظ PDF">🖨️ PDF</button>
                        </div>
                    </div>
                    <div class="custom-table-wrapper">
                        <table id="makhdoumTable">
                            <thead>
                                <tr>
                                    <th>الاسم</th>
                                    <th>التليفون</th>
                                    <th>العنوان</th>
                                    <th>تاريخ الميلاد</th>
                                    <th>السن</th>
                                    <th>الدرجة</th>
                                    <th>الإجراءات</th>
                                </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </section>

        <section id="userSection" class="glass-card user-card animate-pop" style="display: none;">
            <header class="dash-header border-bottom">
                <h2>بياناتك الشخصية 📝</h2>
                <button onclick="logout()" class="btn-logout">خروج 🚪</button>
            </header>
            <div id="userData" class="user-stats-grid">
            </div>
        </section>

    </div>

    <div class="speed-dial-wrapper">
        <div class="speed-dial-list">
            <button type="button" onclick="makeCall('01211030348', 'مارك فيلوباتير')" class="dial-btn item-1">
                📞<span>أ.مارك فيلوباتير</span> 
            </button>
            <button type="button" onclick="makeCall('01220044949', 'بافلي ماجد')" class="dial-btn item-2">
                📞<span>أ.بافلي ماجد</span> 
            </button>
            <button type="button" onclick="makeCall('01156646770', 'بيشوي')" class="dial-btn item-3">
                📞<span>أ.بيشوي</span> 
            </button>
            <button type="button" onclick="makeCall('01274040317', 'فادي شكري')" class="dial-btn item-4">
                📞<span>أ.فادي شكري</span> 
            </button>
            <button type="button" onclick="makeCall('01283838001', 'يوحنا موريس')" class="dial-btn item-5">
                📞<span>أ.يوحنا موريس</span> 
            </button>
            <button type="button" onclick="makeCall('01276583472', 'رضا عدلي')" class="dial-btn item-6">
                📞<span>أ.رضا عدلي</span> 
            </button>
            <button type="button" onclick="makeCall('01008776304', 'مايكل ادوارد')" class="dial-btn item-7">
                📞<span>أ.مايكل ادوارد</span> 
            </button>
            <button type="button" onclick="makeCall('01222282196', 'عصام عطية')" class="dial-btn item-8">
                📞<span>أ.عصام عطية</span> 
            </button>
        </div>
        <div class="main-call-btn" title="تواصل مع الخدام">📞</div>
    </div>

    <div class="install-app-wrapper" id="installAppWrapper">
        <button type="button" id="installAppBtn" onclick="installApp()" class="install-app-btn" title="تنزيل التطبيق على جهازك">
            <span>تنزيل التطبيق</span>
        </button>
    </div>

    <script src="main.js"></script>
</body>
</html>
